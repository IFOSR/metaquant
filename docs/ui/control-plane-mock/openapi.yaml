openapi: 3.1.0
info:
  title: Quant Research Platform Control Plane UI Mock
  version: 0.2.0
  description: >
    G0 frontend contract baseline. Endpoints marked frontend-proposal require
    backend review before implementation.
  license:
    name: Proprietary
servers:
  - url: http://localhost:4010
    description: Local mock
security:
  - oidc: []
  - bearerAuth: []
tags:
  - name: Session
    description: Authenticated principal, roles, scopes, and capabilities.
  - name: ResearchJobs
    description: Research intake, brief versions, candidates, and job state.
  - name: Factors
    description: Factor compilation and immutable factor versions.
  - name: Experiments
    description: Preregistration, runs, validation, and gate decisions.
  - name: Reports
    description: Signed reports with evidence and provenance.
  - name: Approvals
    description: Version-bound approvals and append-only audit events.
  - name: Lineage
    description: Dataset, rule, artifact, and dependency lineage.
  - name: Events
    description: Authorized incremental event notifications.
paths:
  /v1/session:
    get:
      tags: [Session]
      operationId: getSession
      summary: Get the authenticated session and capabilities
      x-source: frontend-proposal
      responses:
        "200":
          description: Actor context and server-authorized capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /v1/research-jobs:
    get:
      tags: [ResearchJobs]
      operationId: listResearchJobs
      summary: List authorized research jobs
      x-source: frontend-proposal
      parameters:
        - $ref: "#/components/parameters/Market"
        - $ref: "#/components/parameters/State"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paginated research jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchJobPage"
    post:
      tags: [ResearchJobs]
      operationId: createResearchJob
      summary: Create a research job
      x-source: technical-design
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResearchJobCommand"
      responses:
        "202":
          $ref: "#/components/responses/CommandAccepted"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/research-jobs/{job_id}:
    get:
      tags: [ResearchJobs]
      operationId: getResearchJob
      summary: Get a research job snapshot
      x-source: technical-design
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Current server snapshot
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchJob"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/research-jobs/{job_id}/brief-versions:
    get:
      tags: [ResearchJobs]
      operationId: listResearchBriefVersions
      summary: List research brief versions
      x-source: g0-contract-baseline
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Immutable brief version history, including drafts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ResearchBriefVersion"
                  next_cursor:
                    type: [string, "null"]
        "404":
          $ref: "#/components/responses/Problem"
    post:
      tags: [ResearchJobs]
      operationId: createResearchBriefVersion
      summary: Create a draft research brief version
      x-source: g0-contract-baseline
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResearchBriefVersionCommand"
      responses:
        "202":
          $ref: "#/components/responses/CommandAccepted"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/research-brief-versions/{brief_version_id}:
    get:
      tags: [ResearchJobs]
      operationId: getResearchBriefVersion
      summary: Get a research brief version
      x-source: g0-contract-baseline
      parameters:
        - $ref: "#/components/parameters/BriefVersionId"
      responses:
        "200":
          description: One research brief version
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchBriefVersion"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      tags: [ResearchJobs]
      operationId: updateResearchBriefVersion
      summary: Update a draft research brief version
      x-source: g0-contract-baseline
      parameters:
        - $ref: "#/components/parameters/BriefVersionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateResearchBriefVersionCommand"
      responses:
        "202":
          $ref: "#/components/responses/CommandAccepted"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/research-brief-versions/{brief_version_id}:freeze:
    post:
      tags: [ResearchJobs]
      operationId: freezeResearchBriefVersion
      summary: Freeze a research brief version
      x-source: g0-contract-baseline
      parameters:
        - $ref: "#/components/parameters/BriefVersionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandMetadata"
      responses:
        "202":
          $ref: "#/components/responses/CommandAccepted"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/research-jobs/{job_id}:propose:
    post:
      tags: [ResearchJobs]
      operationId: proposeCandidates
      summary: Request candidate proposals
      x-source: technical-design
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandMetadata"
      responses:
        "202":
          $ref: "#/components/responses/CommandAccepted"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/research-jobs/{job_id}/candidates:
    get:
      tags: [ResearchJobs]
      operationId: listResearchCandidates
      summary: List the complete candidate ledger
      x-source: frontend-proposal
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Complete candidate ledger, including failed candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidatePage"
  /v1/factors:compile:
    post:
      tags: [Factors]
      operationId: compileFactor
      summary: Compile a factor specification
      x-source: technical-design
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [metadata, factor_spec_id]
              properties:
                metadata:
                  $ref: "#/components/schemas/CommandMetadata"
                factor_spec_id:
                  type: string
      responses:
        "202":
          $ref: "#/components/responses/CommandAccepted"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/factors/{factor_id}/versions:
    get:
      tags: [Factors]
      operationId: listFactorVersions
      summary: List immutable factor versions
      x-source: technical-design
      parameters:
        - name: factor_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Factor versions with compiled IR diagnostics
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/FactorVersion"
  /v1/experiments:preregister:
    post:
      tags: [Experiments]
      operationId: preregisterExperiment
      summary: Preregister an experiment specification
      x-source: technical-design
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - metadata
                - job_id
                - candidate_ids
                - validation_policy_version
              properties:
                metadata:
                  $ref: "#/components/schemas/CommandMetadata"
                job_id:
                  type: string
                candidate_ids:
                  type: array
                  minItems: 1
                  items:
                    type: string
                validation_policy_version:
                  type: string
      responses:
        "202":
          $ref: "#/components/responses/CommandAccepted"
  /v1/experiments/{experiment_id}:run:
    post:
      tags: [Experiments]
      operationId: runExperiment
      summary: Run a preregistered experiment
      x-source: technical-design
      parameters:
        - $ref: "#/components/parameters/ExperimentId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandMetadata"
      responses:
        "202":
          $ref: "#/components/responses/CommandAccepted"
  /v1/experiments/{experiment_id}:
    get:
      tags: [Experiments]
      operationId: getExperiment
      summary: Get an experiment and its runs
      x-source: frontend-proposal
      parameters:
        - $ref: "#/components/parameters/ExperimentId"
      responses:
        "200":
          description: Experiment, current attempt, budget, and heartbeat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
  /v1/experiments/{experiment_id}/validation:
    get:
      tags: [Experiments]
      operationId: getExperimentValidation
      summary: Get experiment validation results
      x-source: technical-design
      parameters:
        - $ref: "#/components/parameters/ExperimentId"
      responses:
        "200":
          description: Validation bundle and gate decisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationBundle"
  /v1/gate-decisions:
    post:
      tags: [Experiments]
      operationId: createGateDecision
      summary: Record a version-bound gate decision
      x-source: technical-design
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - metadata
                - experiment_run_id
                - factor_version_id
                - gate
                - decision
                - validation_bundle_hash
                - policy_version_id
                - resource_version
              properties:
                metadata:
                  $ref: "#/components/schemas/CommandMetadata"
                experiment_run_id:
                  type: string
                factor_version_id:
                  type: string
                gate:
                  type: string
                  enum: [GATE_0, GATE_1, GATE_2, GATE_3, GATE_4, GATE_5]
                decision:
                  type: string
                  enum: [PASS, FAIL, QUARANTINE, BLOCKED, REQUEST_WAIVER]
                validation_bundle_hash:
                  type: string
                policy_version_id:
                  type: string
                resource_version:
                  type: integer
                  minimum: 1
                reason_codes:
                  type: array
                  minItems: 1
                  items:
                    type: string
                evidence_ref_ids:
                  type: array
                  items:
                    type: string
                waiver:
                  oneOf:
                    - $ref: "#/components/schemas/WaiverRequest"
                    - type: "null"
      responses:
        "202":
          $ref: "#/components/responses/CommandAccepted"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/runs/{run_id}:retry:
    post:
      tags: [Experiments]
      operationId: retryRun
      summary: Create a retry attempt for a failed run
      x-source: frontend-proposal
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandMetadata"
      responses:
        "202":
          $ref: "#/components/responses/CommandAccepted"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/runs/{run_id}:cancel:
    post:
      tags: [Experiments]
      operationId: cancelRun
      summary: Request cancellation of a run
      x-source: frontend-proposal
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandMetadata"
      responses:
        "202":
          $ref: "#/components/responses/CommandAccepted"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/reports/{report_id}:
    get:
      tags: [Reports]
      operationId: getResearchReport
      summary: Get a signed research report
      x-source: frontend-proposal
      parameters:
        - name: report_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Signed research report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchReport"
  /v1/approvals:
    get:
      tags: [Approvals]
      operationId: listApprovals
      summary: List approval work and history
      x-source: frontend-proposal
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Approval inbox and history
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Approval"
                  next_cursor:
                    type: [string, "null"]
    post:
      tags: [Approvals]
      operationId: createApprovalDecision
      summary: Record an approval decision
      x-source: integrated-design
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [metadata, approval_id, decision, resource_version]
              properties:
                metadata:
                  $ref: "#/components/schemas/CommandMetadata"
                approval_id:
                  type: string
                decision:
                  type: string
                  enum: [APPROVE, REJECT, REQUEST_CHANGES]
                resource_version:
                  type: integer
                  minimum: 1
      responses:
        "202":
          $ref: "#/components/responses/CommandAccepted"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/lineage/{artifact_id}:
    get:
      tags: [Lineage]
      operationId: getLineage
      summary: Get artifact lineage
      x-source: technical-design
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Upstream and downstream artifact graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineageGraph"
  /v1/dataset-snapshots/{snapshot_id}:
    get:
      tags: [Lineage]
      operationId: getDatasetSnapshot
      summary: Get dataset snapshot metadata
      x-source: frontend-proposal
      parameters:
        - name: snapshot_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dataset snapshot metadata; no direct object-store URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactSummary"
  /v1/rule-snapshots/{snapshot_id}:
    get:
      tags: [Lineage]
      operationId: getRuleSnapshot
      summary: Get rule set snapshot metadata
      x-source: frontend-proposal
      parameters:
        - name: snapshot_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Market rule snapshot metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactSummary"
  /v1/audit-events:
    get:
      tags: [Approvals]
      operationId: listAuditEvents
      summary: List append-only audit events
      x-source: technical-design
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - name: resource_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Append-only audit event page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"
                  next_cursor:
                    type: [string, "null"]
  /v1/events:
    get:
      tags: [Events]
      operationId: streamEvents
      summary: Stream authorized control-plane events
      x-source: frontend-proposal
      parameters:
        - name: after
          in: query
          schema:
            type: string
        - name: resource_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Authorized event stream; transport is pending backend decision
          content:
            text/event-stream:
              schema:
                type: string
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag of the aggregate version being changed.
      schema:
        type: string
        minLength: 3
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
    ExperimentId:
      name: experiment_id
      in: path
      required: true
      schema:
        type: string
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
    BriefVersionId:
      name: brief_version_id
      in: path
      required: true
      schema:
        type: string
    Market:
      name: market
      in: query
      schema:
        $ref: "#/components/schemas/MarketId"
    State:
      name: state
      in: query
      schema:
        $ref: "#/components/schemas/ResearchJobState"
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.example.invalid/.well-known/openid-configuration
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    CommandAccepted:
      description: Command accepted for asynchronous processing
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CommandReceipt"
    Problem:
      description: RFC 9457-style problem response
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    MarketId:
      type: string
      enum: [CN_A, CN_COMMODITY_FUTURES]
    Environment:
      type: string
      enum: [RESEARCH, PAPER, LIVE]
    FrequencyId:
      type: string
      enum: [1d, 1m, 5m, 15m, 30m, 60m]
    ResearchJobState:
      type: string
      enum:
        - DRAFT
        - READY
        - RUNNING
        - WAITING_INPUT
        - BLOCKED_POLICY
        - SUCCEEDED
        - FAILED
        - CANCELLED
        - ARCHIVED
    ResearchBriefVersionState:
      type: string
      enum: [DRAFT, FROZEN, SUPERSEDED]
    ExperimentSpecState:
      type: string
      enum: [DRAFT, PREREGISTERED, SUPERSEDED, CLOSED]
    ExperimentRunState:
      type: string
      enum:
        - QUEUED
        - RUNNING
        - WAITING_INPUT
        - BLOCKED_POLICY
        - SUCCEEDED
        - FAILED_RETRYABLE
        - FAILED_TERMINAL
        - QUARANTINED
        - NON_REPRODUCIBLE
        - CANCELLED
    AttemptState:
      type: string
      enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED, TIMED_OUT]
    ReplicationState:
      type: string
      enum: [DRAFT, RUNNING, REPRODUCED, NON_REPRODUCIBLE, FAILED, CLOSED]
    PackageReleaseState:
      type: string
      enum: [DRAFT, PENDING_APPROVAL, APPROVED, REJECTED, REVOKED]
    DeploymentRunState:
      type: string
      enum:
        - PENDING
        - STARTING
        - RUNNING
        - PAUSED
        - STOPPING
        - STOPPED
        - FAILED
        - KILLED
    Session:
      type: object
      required: [actor, roles, capabilities, environments, markets]
      properties:
        actor:
          type: object
          required: [id, display_name]
          properties:
            id:
              type: string
            display_name:
              type: string
        roles:
          type: array
          items:
            type: string
        capabilities:
          type: array
          items:
            type: string
        environments:
          type: array
          items:
            $ref: "#/components/schemas/Environment"
        markets:
          type: array
          items:
            $ref: "#/components/schemas/MarketId"
    Budget:
      type: object
      additionalProperties: false
      required: [candidate_limit, wall_clock_minutes]
      properties:
        candidate_limit:
          type: integer
          minimum: 1
        llm_token_limit:
          type: integer
          minimum: 0
        cpu_hours:
          type: number
          minimum: 0
        wall_clock_minutes:
          type: integer
          minimum: 1
    CommandMetadata:
      type: object
      additionalProperties: false
      required: [reason, parent_artifact_id, budget, schema_version]
      properties:
        reason:
          type: string
          minLength: 3
        parent_artifact_id:
          type: [string, "null"]
        budget:
          $ref: "#/components/schemas/Budget"
        schema_version:
          type: string
    CreateResearchJobCommand:
      type: object
      additionalProperties: false
      required:
        - metadata
        - market
        - universe_ref
        - frequency
        - decision_clock
        - trade_clock
        - horizon
        - research_brief_version_id
      properties:
        metadata:
          $ref: "#/components/schemas/CommandMetadata"
        market:
          $ref: "#/components/schemas/MarketId"
        universe_ref:
          type: string
        frequency:
          $ref: "#/components/schemas/FrequencyId"
        decision_clock:
          type: string
        trade_clock:
          type: string
        settlement_clock:
          type: string
        exchange_scope:
          type: array
          minItems: 1
          items:
            type: string
            enum: [SHFE, INE, DCE, CZCE, GFEX]
        contract_selection:
          type: string
          enum: [ACTUAL_CONTRACTS_ONLY]
        roll_policy:
          type: string
          description: Immutable RollPolicyVersion reference.
        horizon:
          type: string
        research_brief_version_id:
          type: string
      allOf:
        - if:
            properties:
              market:
                const: CN_COMMODITY_FUTURES
            required: [market]
          then:
            properties:
              settlement_clock:
                type: string
              exchange_scope:
                type: array
                minItems: 1
                items:
                  type: string
              contract_selection:
                type: string
                const: ACTUAL_CONTRACTS_ONLY
              roll_policy:
                type: string
            required:
              - settlement_clock
              - exchange_scope
              - contract_selection
              - roll_policy
    ResearchBriefContent:
      type: object
      required:
        - hypothesis
        - economic_mechanism
        - expected_direction
        - falsification_conditions
        - allowed_data_domains
        - constraints
      properties:
